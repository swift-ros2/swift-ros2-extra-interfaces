# Upstream IDL for Scripts/regenerate.sh and the oracles: <name> <url> <distribution> <commit>.
# control_msgs, moveit_msgs, octomap_msgs and object_recognition_msgs are pinned at the release
# tag rosdistro lists for the distribution (distribution.yaml "release: version"), which is what
# the oracle installs from apt. To move a line: git ls-remote --tags <url> <version>, then run
# Scripts/regenerate.sh and commit this file together with the regenerated sources.
# common_interfaces, rcl_interfaces and unique_identifier_msgs are the commits
# swift-ros2-common-interfaces' idl.lock pins: their types live in that package (or in
# swift-ros2-rosidl), and the hashes of the types here must include the same dependency IDL.
